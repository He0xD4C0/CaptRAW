name: Bug report
description: 报告可复现的功能、显示或稳定性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿在这里公开安全漏洞、用户照片、私人路径或凭据。安全问题请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: CaptRAW 版本
      placeholder: 例如 0.65.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Linux
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏样本描述最小可复现流程。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请移除照片、用户名、路径、序列号、令牌和其他敏感信息。
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除敏感信息，且这不是需要私密报告的安全漏洞
          required: true
