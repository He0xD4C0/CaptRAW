name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO signoff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - name: Verify every pull request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
