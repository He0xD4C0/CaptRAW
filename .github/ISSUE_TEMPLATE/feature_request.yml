name: Feature request
description: 提议新的工作流或产品能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的具体困难，而不只是描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: scope
    attributes:
      label: 兼容性、许可证或性能影响
      description: 如涉及新依赖、模型、媒体或数据格式，请说明来源和许可证。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 issue 和文档
          required: true
        - label: 提案不包含未公开的安全漏洞或私人数据
          required: true
